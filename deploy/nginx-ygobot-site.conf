limit_req_zone  $binary_remote_addr zone=page:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=api:10m  rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server {
    listen 8787 default_server;
    server_name _;
    server_tokens off;

    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          120s;

    limit_conn conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    access_log /var/log/nginx/ygobot.access.log;
    error_log  /var/log/nginx/ygobot.error.log;

    location ~ ^/stats/[^/]+/statistics/api/ {
        limit_req zone=api burst=20 nodelay;
        include snippets/ygobot-proxy.conf;
    }
    location ~ ^/(stats|s)(/|$) {
        limit_req zone=page burst=30 nodelay;
        include snippets/ygobot-proxy.conf;
    }
    location = /health {
        include snippets/ygobot-proxy.conf;
    }
    location = / {
        include snippets/ygobot-proxy.conf;
    }
    location / {
        return 404;
    }
}

# Separate optional TLS query endpoint. Install only after reviewing live nginx
# configuration and certificate paths; do not replace the existing 8787 server.
server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;
    ssl_certificate /etc/nginx/ssl/ygobot-query.crt;
    ssl_certificate_key /etc/nginx/ssl/ygobot-query.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    client_max_body_size 64k;

    # Includes the slash-less path. App also refuses forwarded admin requests.
    location ^~ /query-api/admin { return 404; }
    location /query-api/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location / { return 404; }
}

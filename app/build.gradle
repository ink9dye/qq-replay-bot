plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.moecard.watch'
    compileSdk 34

    defaultConfig {
        applicationId 'com.moecard.watch'
        minSdk 26
        targetSdk 34
        versionCode 22
        versionName '2.1.0'
        vectorDrawables { useSupportLibrary true }
    }

    signingConfigs {
        debug {
            // 使用 Android 默认 debug keystore，无需额外配置即可安装
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-opt-in=androidx.compose.material3.ExperimentalMaterial3Api']
    }

    buildFeatures {
        compose true
        // AGP 8 默认不生成 BuildConfig；抽屉底部要显示真实版本号
        buildConfig true
    }

    composeOptions {
        // Kotlin 1.9.x 对应 Compose 编译器 1.5.14
        kotlinCompilerExtensionVersion = '1.5.14'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // 查询端：QQ 头像 / 卡图异步加载（阿里云 maven 可拉）
    implementation 'io.coil-kt:coil-compose:2.6.0'
    // .yrp 正文是 LZMA1 raw 流；要读出录像里双方的真实顺序（服务端会逐字比对），
    // 只能照服务端 decompress_replay() 的算法解一遍。纯 Java 实现，体积约 120KB。
    implementation 'org.tukaani:xz:1.9'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    // Android 单测里的 org.json 是空壳实现，补真实库给 QueryParseTest 用
    testImplementation 'org.json:json:20231013'
}

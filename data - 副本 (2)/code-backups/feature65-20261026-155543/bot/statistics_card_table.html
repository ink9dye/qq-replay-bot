<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卡片统计 · 前100观察</title><style>
:root{font:15px "Microsoft YaHei",system-ui,sans-serif;color:#173529;background:#f3f5f0}*{box-sizing:border-box}body{margin:0}a{color:#32684f}button,input,select{font:inherit}button{cursor:pointer}header{background:#173f32;color:white;padding:28px max(20px,calc((100vw - 1160px)/2));border-bottom:5px solid #c9e787}header a{color:#d6e5b1}h1{font-size:28px;margin:18px 0 8px}header p{max-width:900px;color:#d5e3d6;line-height:1.8}main{max-width:1200px;margin:auto;padding:24px 20px}.panel{min-width:0;background:white;border:1px solid #dde4da;border-radius:12px;padding:20px;margin-bottom:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.note{font-size:13px;color:#65776b;line-height:1.8}.warning{background:#fff1dc;color:#8b521c;padding:12px;border-radius:8px}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.controls label{font-size:13px;color:#647569;min-width:140px;flex:1}input,select{display:block;width:100%;margin-top:7px;padding:10px;border:1px solid #cbd6c9;border-radius:7px;background:white;color:#234230}button.primary{padding:10px 17px;border:0;border-radius:7px;background:#275f45;color:white}.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:740px}th,td{padding:14px 10px;border-bottom:1px solid #e8eee3;text-align:left;font-size:14px}th{font-size:12px;background:#f5f7f2;color:#6b7f6b}th:not(:first-child),td:not(:first-child){font-variant-numeric:tabular-nums}.name{font-weight:600}.muted{color:#89968b}.textbutton{border:0;background:none;color:#32684f;text-decoration:underline;text-underline-offset:4px;padding:0}.tag{display:inline-block;font-size:12px;background:#eef3e8;padding:3px 7px;border-radius:5px;margin:2px}.totals{display:flex;flex-wrap:wrap;gap:18px;margin:16px 0}.totals b{font-size:24px;margin-right:7px}.totals span{font-size:13px;color:#627760}h2{font-size:20px;margin:0 0 10px}dialog{border:1px solid #b5c8b1;border-radius:14px;padding:24px;width:min(740px,94vw);max-height:88vh;color:#173529}dialog::backdrop{background:#10291db0}.close{float:right;border:0;border-radius:7px;padding:7px 12px;background:#eef3e8;color:#284f37}.cards{display:grid;grid-template-columns:1fr 1fr;gap:7px}.card{font-size:14px;background:#f4f7f0;padding:9px;border-radius:5px}h3{font-size:15px;margin:22px 0 10px}.download{display:inline-block;padding:10px 15px;border-radius:7px;background:#275f45;color:white;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #86b273;outline-offset:2px}@media(max-width:650px){main{padding:20px 12px}.panel{padding:15px}.controls{display:grid;grid-template-columns:1fr}.cards{grid-template-columns:1fr}header{padding:24px 20px}h1{font-size:25px}.top{align-items:flex-start}}
table{min-width:1120px}th,td{font-variant-numeric:tabular-nums;padding:12px 9px}thead th{text-align:center}td:not(:nth-child(2)){text-align:center}.card-name{font-weight:600;text-align:left}.code{font-size:12px;color:#7b8b7b}.pager{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin:14px 0}.pager button{border:1px solid #c7d5c4;background:white;color:#285b3d;padding:8px 14px;border-radius:7px}td:nth-child(2){min-width:200px}.wrap{max-height:72vh}thead{position:sticky;top:0;z-index:2}thead th{background:#eef3e8}a.detail-link{display:block;margin:5px 0;white-space:nowrap}button:disabled{opacity:.45;cursor:default}</style></head><body><header><a href="/statistics">前排卡组</a>　<a href="/statistics/groups">系列统计</a>　<a href="/statistics/card-table">卡片统计</a>　<a href="/statistics/matrix">对阵矩阵</a><h1>卡片统计</h1><p>每位当前玩家只取一份最新有效构筑。主卡与Side分列，额外独立；同名同效果异画合并，缺失记录不作0。</p></header><main><section class="panel"><div class="top"><div id="status" class="note" role="status">读取中…</div><button id="refresh" class="primary">刷新统计</button></div><div class="controls"><label>搜索卡名或卡片密码<input id="search" type="search" placeholder="搜索卡名或卡片密码" maxlength="80"></label><label>构筑来源<select id="basis"><option value="observed">每人最新观测（可能换边）</option><option value="initial">已确认同场首局</option></select></label><label>统计分区<select id="partition"><option value="main_side">主卡与Side</option><option value="extra">额外（独立）</option></select></label></div><p id="coverage" class="note"></p><div id="pagerTop" class="pager"></div><div class="wrap"><table id="cards"></table></div><div id="pagerBottom" class="pager"></div><p class="note">“≥”表示已确认至少这些人携带，仍有未知；1／2／3／4+张只统计该分区完整的构筑。Side无完整样本时显示未知，不能把它当成无人携带。总人数按同一人主卡＋Side去重。</p></section></main><script>
const $=id=>document.getElementById(id),el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};let data=null,page=0,request=0;
function presence(p){if(p.unknown_presence_players)return p.confirmed_players?'≥'+p.confirmed_players:'未知';return String(p.confirmed_players)}
function bin(p,key){return p.known_copy_players?(key==='4+'?p.four_plus:p.bins[key]):'—'}
function pager(id,total){const n=$(id),back=el('button','上一页'),next=el('button','下一页');n.replaceChildren();back.disabled=page===0;next.disabled=(page+1)*25>=total;back.onclick=()=>{page--;render()};next.onclick=()=>{page++;render()};n.append(back,el('span',`${total?page+1:0} / ${Math.ceil(total/25)} · ${total}张卡`,'note'),next)}
function render(){if(!data)return;const extra=$('partition').value==='extra',term=$('search').value.trim().toLocaleLowerCase();const filtered=data.rows.filter(r=>{const p=r.partitions;if(!(extra?p.extra.confirmed_players:p.total.confirmed_players))return false;return !term||r.name.toLocaleLowerCase().includes(term)||r.codes.some(c=>String(c).includes(term))});filtered.sort((a,b)=>(extra?b.partitions.extra.confirmed_players-a.partitions.extra.confirmed_players:b.partitions.total.confirmed_players-a.partitions.total.confirmed_players)||a.code-b.code);page=Math.min(page,Math.max(0,Math.ceil(filtered.length/25)-1));const table=$('cards');table.replaceChildren();const head=el('thead'),h=el('tr');for(const name of ['序号','卡片','投入人数']){const th=el('th',name);th.rowSpan=2;h.append(th)}for(const label of extra?['额外投入人数']:['主卡投入人数','Side投入人数']){const th=el('th',label);th.colSpan=5;h.append(th)}const detail=el('th','详情');detail.rowSpan=2;h.append(detail);head.append(h);const sub=el('tr');for(let i=0;i<(extra?1:2);i++)for(const label of ['携带','1张','2张','3张','4+张'])sub.append(el('th',label));head.append(sub);table.append(head);const body=el('tbody');for(const [offset,r]of filtered.slice(page*25,(page+1)*25).entries()){const tr=el('tr'),name=el('td');name.append(el('div',r.name,'card-name'),el('div',r.code+(r.codes.length>1?' · 异画合并':''),'code'));tr.append(el('td',page*25+offset+1),name,el('td',presence(r.partitions[extra?'extra':'total'])));for(const part of extra?['extra']:['main','side']){const p=r.partitions[part];tr.append(el('td',presence(p)));for(const key of ['1','2','3','4+'])tr.append(el('td',bin(p,key)))}const td=el('td'),investment=el('a','投入详情（按人）','detail-link'),metrics=el('a','指标（按小局）','detail-link');investment.href='/statistics/investment?code='+r.code+'&basis='+data.basis;metrics.href='/statistics/cards?code='+r.code+'&partition='+(extra?'extra':'main');td.append(investment,metrics);tr.append(td);body.append(tr)}if(!filtered.length){const tr=el('tr'),td=el('td','暂无符合条件的卡片。');td.colSpan=extra?9:14;tr.append(td);body.append(tr)}table.append(body);pager('pagerTop',filtered.length);pager('pagerBottom',filtered.length)}
async function load(){const id=++request;$('status').textContent='读取统计中…';try{const r=await fetch('/statistics/api/card-table?basis='+$('basis').value,{cache:'no-store',credentials:'same-origin'});if(!r.ok)throw Error(await r.text());data=await r.json();if(id!==request)return;$('status').textContent=`前${data.current_players}名 · 已覆盖${data.covered_players}人 · 未采集${data.missing_players}人 · 榜单${data.roster.version}${data.roster.stale?'（过期名单）':''} · 统计 ${new Date(data.generated_at*1000).toLocaleString('zh-CN',{hour12:false})}`;$('coverage').textContent=`当前选源已确认 ${data.known_basis_players}/${data.selected_players}人，选源未知 ${data.unknown_basis_players}人；主卡完整 ${data.partition_known_players.main}人，Side完整 ${data.partition_known_players.side}人，额外完整 ${data.partition_known_players.extra}人。`;page=0;render()}catch(e){$('status').textContent=e.message}}
$('refresh').onclick=load;$('basis').onchange=load;$('partition').onchange=()=>{page=0;render()};$('search').oninput=()=>{page=0;render()};load();
</script></body></html>

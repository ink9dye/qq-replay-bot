<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卡片详情 · 前100观察</title><link rel="stylesheet" href="/statistics/assets/statistics_ui.css"><style>
.main-nav{display:flex;gap:10px 24px;flex-wrap:wrap;margin-bottom:20px}.main-nav a{font-size:15px;text-decoration:none;padding:8px 0;border-bottom:2px solid transparent}.main-nav a:hover{border-color:currentColor}
</style><style>.card-detail{max-width:1180px}.card-detail .panel{border-radius:16px;box-shadow:0 4px 18px #244b3510}.card-detail h2{font-size:20px}.card-detail .metric-value{font-weight:650}.cardpart button{background:#edf2e8;color:#34563e}.cardpart button[aria-pressed=true]{background:#275f45;color:white}.card-detail .chart-line{grid-template-columns:145px minmax(180px,1fr) 200px}.card-detail .metrics-filters{margin-bottom:16px}.card-detail #options:empty{display:none}</style><link rel="stylesheet" href="/statistics/assets/statistics_nav.css"><link rel="stylesheet" href="/statistics/assets/statistics_theme.css"></head><body><nav class="main-nav" aria-label="主要功能"><a href="/statistics">玩家排名</a><a href="/statistics/card-table">卡片统计</a><a href="/statistics/matrix">系列胜率</a><a href="/statistics/recordings">录像筛选</a></nav>
<header><h1>卡片详情</h1><p>投入率限定当前前100，以已采集选手的最新有效构筑为分母，每人一次；胜率按真实小局。两种分母分别展示。</p></header>
<main class="card-detail"><section class="panel"><div class="search"><input id="q" type="search" aria-label="卡名或卡号" placeholder="输入卡名或卡号" maxlength="80"><button id="find">查找卡片</button></div><div id="options" class="options"></div>
<div class="metrics-filters"><label>我方范围<select id="selfRange"><option value="100">前100</option><option value="200">前200</option><option value="all">全部</option></select></label><label>对手范围<select id="opponentRange"><option value="all">全部</option><option value="100">前100</option><option value="200">前200</option></select></label><label>指标卡片分区<select id="partition"><option value="main">主卡</option><option value="side">Side</option><option value="extra">额外（出场独立）</option></select></label><label>我方卡组<select id="deck"><option value="">全部</option></select></label><label>我方含系列<select id="series"><option value="">全部</option></select></label><label>对手卡组（仅小局）<select id="opponent"><option value="">全部</option></select></label><label>对手含系列（仅小局）<select id="opponent_series"><option value="">全部</option></select></label><label>实际先后攻（仅小局）<select id="first"><option value="all">总体</option><option value="first">先攻</option><option value="second">后攻</option></select></label><label>投入构筑来源（仅按人）<select id="investbasis"><option value="observed">每人最新观测（可能换边）</option><option value="initial">已确认同场首局</option></select></label></div>
<label><input id="internal" type="checkbox"> 仅双方当前均在前100（仅小局）</label><p id="status" role="status" class="note">选择卡片后查询。</p></section>
<div id="highlights" class="metric-grid"></div>
<section id="investmentPanel" class="panel" hidden><h2 id="investmentTitle">各卡组投入分布 · 按人</h2><p id="investmentMeta" class="note"></p><div id="allocationPies" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px;margin:24px 0"></div><div class="cardpart"><button data-part="main" aria-pressed="true">主卡</button><button data-part="side" aria-pressed="false">Side</button><button data-part="total" aria-pressed="false">总投入</button><button data-part="extra" aria-pressed="false">额外</button></div><p class="legend"><span style="background:#8fa7b6">1张</span><span style="background:#c3ae86">2张</span><span style="background:#b08b88">3张</span></p><div class="chart-scroll"><div id="deckCharts"></div></div><p class="note">左侧为确认投入人数／该类玩家人数；主卡或额外与Side相加得到总投入；总投入分段展示已记录张数，不完整时是已知下限，不能当作完整构筑。这里不受对手、先后攻和内战小局筛选影响。</p></section>
<section id="resultPanel" class="panel" hidden><h2>小局指标与分母</h2><p class="note">基准为所选对局的已知胜负平。括号表示相对同列基准的百分点差，不代表因果提升。抽到只含初始／通常／效果抽卡，不含检索回收；无有效样本不会显示0%。</p><div class="wrap"><table><thead><tr><th>指标</th><th>总体</th><th>先攻</th><th>后攻</th></tr></thead><tbody id="rates"></tbody></table></div><p id="quality" class="note"></p></section>
<section id="sourcePanel" hidden><div id="sources" hidden></div></section></main>
<script src="/statistics/assets/statistics_samples.js"></script><script src="/statistics/assets/statistics_filter_controls.js"></script><script src="/statistics/assets/statistics_card_metrics.js"></script></body><script src="/statistics/assets/statistics_nav.js"></script></html>

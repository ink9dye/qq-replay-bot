<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>卡片统计 · 前100观察</title><style>
:root{font:15px "Microsoft YaHei",system-ui,sans-serif;color:#173529;background:#f3f5f0}*{box-sizing:border-box}body{margin:0}a{color:#32684f}button,input,select{font:inherit}button{cursor:pointer}header{background:#173f32;color:white;padding:28px max(20px,calc((100vw - 1160px)/2));border-bottom:5px solid #c9e787}header a{color:#d6e5b1}h1{font-size:28px;margin:18px 0 8px}header p{max-width:900px;color:#d5e3d6;line-height:1.8}main{max-width:1200px;margin:auto;padding:24px 20px}.panel{min-width:0;background:white;border:1px solid #dde4da;border-radius:12px;padding:20px;margin-bottom:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.note{font-size:13px;color:#65776b;line-height:1.8}.warning{background:#fff1dc;color:#8b521c;padding:12px;border-radius:8px}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.controls label{font-size:13px;color:#647569;min-width:140px;flex:1}input,select{display:block;width:100%;margin-top:7px;padding:10px;border:1px solid #cbd6c9;border-radius:7px;background:white;color:#234230}button.primary{padding:10px 17px;border:0;border-radius:7px;background:#275f45;color:white}.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:740px}th,td{padding:14px 10px;border-bottom:1px solid #e8eee3;text-align:left;font-size:14px}th{font-size:12px;background:#f5f7f2;color:#6b7f6b}th:not(:first-child),td:not(:first-child){font-variant-numeric:tabular-nums}.name{font-weight:600}.muted{color:#89968b}.textbutton{border:0;background:none;color:#32684f;text-decoration:underline;text-underline-offset:4px;padding:0}.tag{display:inline-block;font-size:12px;background:#eef3e8;padding:3px 7px;border-radius:5px;margin:2px}.totals{display:flex;flex-wrap:wrap;gap:18px;margin:16px 0}.totals b{font-size:24px;margin-right:7px}.totals span{font-size:13px;color:#627760}h2{font-size:20px;margin:0 0 10px}dialog{border:1px solid #b5c8b1;border-radius:14px;padding:24px;width:min(740px,94vw);max-height:88vh;color:#173529}dialog::backdrop{background:#10291db0}.close{float:right;border:0;border-radius:7px;padding:7px 12px;background:#eef3e8;color:#284f37}.cards{display:grid;grid-template-columns:1fr 1fr;gap:7px}.card{font-size:14px;background:#f4f7f0;padding:9px;border-radius:5px}h3{font-size:15px;margin:22px 0 10px}.download{display:inline-block;padding:10px 15px;border-radius:7px;background:#275f45;color:white;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #86b273;outline-offset:2px}@media(max-width:650px){main{padding:20px 12px}.panel{padding:15px}.controls{display:grid;grid-template-columns:1fr}.cards{grid-template-columns:1fr}header{padding:24px 20px}h1{font-size:25px}.top{align-items:flex-start}}
table{min-width:980px}th,td{font-variant-numeric:tabular-nums;padding:12px 9px}thead th{text-align:center}td:not(:nth-child(2)){text-align:center}.card-name{font-weight:600;text-align:left}.code{font-size:12px;color:#7b8b7b}.pager{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin:14px 0}.pager button{border:1px solid #c7d5c4;background:white;color:#285b3d;padding:8px 14px;border-radius:7px}td:nth-child(2){min-width:200px}.wrap{max-height:72vh}thead{position:sticky;top:0;z-index:2}thead th{background:#eef3e8}a.detail-link{display:block;margin:5px 0;white-space:nowrap}button:disabled{opacity:.45;cursor:default}</style><style>

</style><link rel="stylesheet" href="/statistics/assets/statistics_nav.css"><link rel="stylesheet" href="/statistics/assets/statistics_theme.css"></head><body><nav class="main-nav" aria-label="主要功能"><a href="/statistics">玩家排名</a><a href="/statistics/cards-report">卡片统计</a><a href="/statistics/matrix">卡组胜率</a><a href="/statistics/recordings">录像筛选</a></nav><header><h1>卡片统计</h1><p>按所选我方范围玩家的投入人数排名，默认展示前100张卡片；搜索可查全部已收录卡片。点击详情查看各卡组投入与单卡指标。</p></header><main><section class="panel"><div class="top"><div id="status" class="note" role="status">读取中…</div><button id="both100" type="button">前100内战</button><button id="refresh" class="primary">刷新统计</button></div><div class="controls"><label>我方范围<select id="selfRange"><option value="100">前100</option><option value="200">前200</option><option value="all">全部</option></select></label><label>对手范围<select id="opponentRange"><option value="all">全部</option><option value="100">前100</option><option value="200">前200</option></select></label><label>搜索卡名或卡片密码<input id="search" type="search" placeholder="搜索卡名或卡片密码" maxlength="80"></label><label>限定卡组<select id="deckFilter"><option value="">全部卡组</option></select></label><label>构筑来源<select id="basis"><option value="observed">每人最新观测（可能换边）</option><option value="initial">已确认同场首局</option></select></label><label>统计分区<select id="partition"><option value="all">全部卡片</option><option value="main_side">主卡与Side</option><option value="extra">额外（独立）</option></select></label><label>排行方式<select id="ranking"><option value="carrying">携带率</option><option value="carried_overall">投入该卡的小局胜率 · 总体</option><option value="carried_first">投入该卡的小局胜率 · 先攻</option><option value="carried_second">投入该卡的小局胜率 · 后攻</option><option value="overall">抽到后小局胜率 · 总体</option><option value="first">抽到后小局胜率 · 先攻</option><option value="second">抽到后小局胜率 · 后攻</option></select></label><label>最低有效样本占比（%）<input id="minimum" type="number" min="0" step="0.1" value="1" aria-describedby="sampleRule"></label><label>选择卡片<select id="cardPick" multiple size="4"></select></label></div><p class="note">可只选卡组，查看该卡组各张卡的胜率；再选卡片可缩小范围。投入胜率按对应小局实际投入计算，抽到后胜率仅计算确证抽到。</p><p id="coverage" class="note"></p><p id="sampleRule" class="note" role="status"></p><div id="pagerTop" class="pager"></div><div class="wrap"><table id="cards"></table></div><div id="pagerBottom" class="pager"></div><p class="note">“≥”表示已确认至少这些人投入，仍有未知；1／2／3张只统计该分区完整的构筑。Side无完整样本时显示未知，不能把它当成无人投入。总人数按同一人主卡或额外＋Side去重；分母为所选我方范围中已采集到的选手构筑数，每人一次；未采集人数另列，不进分母。</p></section></main><script src="/statistics/assets/statistics_filter_controls.js"></script><script>
const $=id=>document.getElementById(id),el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};let data=null,page=0,request=0;
function presence(p){if(p.unknown_presence_players)return p.confirmed_players?'≥'+p.confirmed_players:'未知';return String(p.confirmed_players)}
function bin(p,key){return p.known_copy_players?(key==='4+'?p.four_plus:p.bins[key]):'—'}
function pager(id,total){const n=$(id),back=el('button','上一页'),next=el('button','下一页');n.replaceChildren();back.disabled=page===0;next.disabled=(page+1)*25>=total;back.onclick=()=>{page--;render()};next.onclick=()=>{page++;render()};n.append(back,el('span',`${total?page+1:0} / ${Math.ceil(total/25)} · ${total}张卡`,'note'),next)}
function percentParts(text){
  const raw=String(text==null?'':text).trim().replace(/%$/,'').trim();
  if(!/^\d+(?:\.\d+)?$/.test(raw)) return null;
  const parts=raw.split('.'),whole=parts[0],frac=parts[1]||'';
  if(frac.length>6 || Number(raw)>100) return null;
  return {num:Number(whole+frac),scale:Math.pow(10,frac.length),text:raw};
}
function render(){if(!data)return;const extra=$('partition').value==='extra',all=$('partition').value==='all',term=$('search').value.trim().toLocaleLowerCase();const ranking=$('ranking').value,picks=FilterControls.values('cardPick'),carried=ranking.startsWith('carried_'),column=carried?ranking.slice(8):ranking==='carrying'?'overall':ranking,metric=r=>carried?((r.carried_rankings[r.base_partition]||{})[column]||{}):(r.draw_rankings[column]||{});const parsed=percentParts($('minimum').value);if(!parsed){$('sampleRule').textContent='占比请填写 0 到 100 的十进制数（最多6位小数）；空值、负值、无穷或科学计数法都不参与比较。';$('cards').replaceChildren();$('pagerTop').replaceChildren();$('pagerBottom').replaceChildren();return;}const N=Number((data.sample_baselines||{})[column]);if(!Number.isInteger(N)||N<0){$('sampleRule').textContent='统计网页服务版本不兼容：缺少 sample_baselines。请重新打开独立统计网页服务后刷新；本页不会重启服务。';$('cards').replaceChildren();$('pagerTop').replaceChildren();$('pagerBottom').replaceChildren();return;}if(N===0){$('sampleRule').textContent='本列暂无已知结果小局（N=0），不生成比例，也不把无样本当成0%。';$('cards').replaceChildren();$('pagerTop').replaceChildren();$('pagerBottom').replaceChildren();return;}const nOf=r=>ranking==='carrying'?r.carried_game_count:(metric(r).denominator||0),gate=(n,d)=>parsed&&d>0&&n>0&&n*100*parsed.scale>=parsed.num*d,eff=d=>parsed&&parsed.num?Math.ceil(parsed.num*d/(100*parsed.scale)):0,ratioText=(n,d)=>d>0?(100*n/d).toFixed(1)+'%':'—';$('sampleRule').textContent=`只显示占比≥${parsed.text}%（含等于）的卡片：n=该指标有效小局，N=本列已知胜负平小局，当前等效最低${eff(N)}局（N=${N}）。`+(ranking==='carrying'?'携带率排行：样本为投入该卡且胜负平已知的小局。':(carried?'投入胜率排行：样本为当局主卡或额外实际投入该卡且胜负平已知的小局；':'抽到后胜率排行：样本为确证抽到该卡且胜负平已知的小局；')+(column==='first'?'仅先攻。':column==='second'?'仅后攻。':'含先后攻及先后攻未知。'))+'按玩家小局视角计数，同局双方各有一份样本；同一方多张同卡只计一次。人数、卡片张数和整场BO3数均不是此门槛。';const filtered=data.rows.filter(r=>{const p=r.partitions;if(picks.includes('\"__no_selection__\"')||($('cardPick').dataset.none==='1'))return false;if(picks.length&&!picks.includes(String(r.code)))return false;if(ranking==='carrying'&&!p.total.confirmed_players)return false;if(ranking!=='carrying'&&!carried&&r.base_partition==='extra')return false;if(!gate(nOf(r),N))return false;if(!all&&r.base_partition!==(extra?'extra':'main'))return false;return !term||r.name.toLocaleLowerCase().includes(term)||r.codes.some(c=>String(c).includes(term))});filtered.sort((a,b)=>ranking==='carrying'?(b.partitions.total.confirmed_players-a.partitions.total.confirmed_players)||a.code-b.code:(metric(b).wins/metric(b).denominator-metric(a).wins/metric(a).denominator)||(metric(b).denominator-metric(a).denominator)||a.code-b.code);if(!term&&!$('deckFilter').value)filtered.splice(100);page=Math.min(page,Math.max(0,Math.ceil(filtered.length/25)-1));const table=$('cards');table.replaceChildren();const head=el('thead'),h=el('tr');for(const name of ['序号','卡片',ranking==='carrying'?'投入人数':(carried?'投入该卡胜率':'抽到后胜率')+' · 胜/有效小局数','样本 n/N · 占比 · 等效最低']){const th=el('th',name);th.rowSpan=2;h.append(th)}for(const label of extra?['额外投入人数']:['主卡／额外投入人数','Side投入人数']){const th=el('th',label);th.colSpan=4;h.append(th)}const detail=el('th','详情');detail.rowSpan=2;h.append(detail);head.append(h);const sub=el('tr');for(let i=0;i<(extra?1:2);i++)for(const label of ['人数','1张','2张','3张'])sub.append(el('th',label));head.append(sub);table.append(head);const body=el('tbody');for(const [offset,r]of filtered.slice(page*25,(page+1)*25).entries()){const tr=el('tr'),name=el('td');name.append(el('div',r.name,'card-name'),el('div',r.code,'code'));tr.append(el('td',page*25+offset+1),name,el('td',ranking==='carrying'?presence(r.partitions.total)+' / '+data.selected_players:metric(r).percentage.toFixed(1)+'% · '+metric(r).wins+'/'+metric(r).denominator),el('td',nOf(r)+'/'+N+' · '+ratioText(nOf(r),N)+' · ≥'+eff(N)+'局'));for(const part of extra?['extra']:[r.base_partition||'main','side']){const p=r.partitions[part];tr.append(el('td',presence(p)));for(const key of ['1','2','3'])tr.append(el('td',bin(p,key)))}const td=el('td'),investment=el('a','投入详情（按人）','detail-link'),metrics=el('a','指标（按小局）','detail-link');investment.href='/statistics/investment?code='+r.code+'&basis='+data.basis;metrics.href='/statistics/cards?code='+r.code+'&partition='+(extra?'extra':'main');investment.textContent='查看详情';investment.href='/statistics/cards?code='+r.code+'&partition='+(r.base_partition||'main');if($('deckFilter').value)investment.href+='&deck='+encodeURIComponent(JSON.parse($('deckFilter').value));if(column==='first'||column==='second')investment.href+='&first='+column;investment.href+='&self_range='+$('selfRange').value+'&opponent_range='+$('opponentRange').value;td.append(investment);tr.append(td);body.append(tr)}if(!filtered.length){const tr=el('tr'),td=el('td','暂无符合条件的卡片。');td.colSpan=extra?9:13;tr.append(td);body.append(tr)}table.append(body);pager('pagerTop',filtered.length);pager('pagerBottom',filtered.length)}
async function load(){
 const id=++request,selectedDeck=$('deckFilter').value,picks=FilterControls.values('cardPick'),pickLabels=new Map(Array.from($('cardPick').options).map(o=>[o.value,o.textContent]));
 data=null;$('status').textContent='读取统计中…';$('cards').replaceChildren();$('pagerTop').replaceChildren();$('pagerBottom').replaceChildren();$('sampleRule').textContent='';
 const params=new URLSearchParams({basis:$('basis').value,self_range:$('selfRange').value,opponent_range:$('opponentRange').value});if(selectedDeck)params.append('deck',selectedDeck);
 try{
  const r=await fetch('/statistics/api/card-table?'+params,{cache:'no-store',credentials:'same-origin'});if(!r.ok)throw Error(await r.text());
  const next=await r.json();if(id!==request)return;
  if(next.deck_filter_version!==2||!Array.isArray(next.deck_choices)||next.rows.some(r=>!r.carried_rankings))throw Error('卡组筛选接口尚未加载新版，本页不展示未限定卡组的旧结果。');
  if(next.range_filter_version!==1||next.rank_scope?.self_range!==params.get('self_range')||next.rank_scope?.opponent_range!==params.get('opponent_range'))throw Error('双方范围未被新版接口确认，暂不显示结果。');
  const baselines=next.sample_baselines;if(!baselines||!['overall','first','second'].every(k=>Number.isInteger(baselines[k])&&baselines[k]>=0))throw Error('统计网页服务版本不兼容：缺少有效小局分母。');
  const expected=selectedDeck?[JSON.parse(selectedDeck)]:[];if(JSON.stringify(next.filters?.deck_types)!==JSON.stringify(expected))throw Error('卡组条件未被接口确认，暂不展示结果。');
  data=next;$('deckFilter').replaceChildren(new Option('全部卡组',''));for(const name of next.deck_choices)$('deckFilter').append(new Option(name,JSON.stringify(name)));if(selectedDeck&&!Array.from($('deckFilter').options).some(o=>o.value===selectedDeck))$('deckFilter').append(new Option(JSON.parse(selectedDeck),selectedDeck));$('deckFilter').value=selectedDeck;
  $('status').textContent=`${selectedDeck?'卡组：'+JSON.parse(selectedDeck)+' · ':''}我方${scopeName(data.rank_scope.self_range)} / 对手${scopeName(data.rank_scope.opponent_range)} · 已覆盖${data.covered_players}人 · 榜单${data.roster.version}${data.roster.stale?'（过期名单）':''}`;
  $('status').textContent+=data.rank_scope.complete?'':'；排名未确认'+data.rank_scope.unknown_rank_players+'人（仅已核验样本，非完整前200，可刷新继续核验）';
  $('coverage').textContent=`所选卡组范围按各小局当时卡组分类，不用玩家最新构筑倒推历史。投入人数另按我方范围最新有效构筑统计（对手条件仅限小局指标）：${data.selected_players}人，选源已确认${data.known_basis_players}人、未知${data.unknown_basis_players}人。`;
  $('cardPick').replaceChildren();for(const card of data.rows){const o=el('option',card.name+' #'+card.code);o.value=card.code;o.selected=picks.includes(String(card.code));$('cardPick').append(o)}for(const code of picks)if(!Array.from($('cardPick').options).some(o=>o.value===code)){const o=new Option((pickLabels.get(code)||code)+'（本卡组无样本）',code);o.selected=true;$('cardPick').append(o)}$('cardPick').dispatchEvent(new Event('change'));page=0;render();
 }catch(e){if(id===request){data=null;$('status').textContent=e.message;$('coverage').textContent='';}}
}
const scopeName=v=>v==='all'?'全部已收录':'前'+v;
$('selfRange').onchange=load;$('opponentRange').onchange=load;$('both100').onclick=()=>{$('selfRange').value='100';$('opponentRange').value='100';load()};
const sidePreset=new URLSearchParams(location.search);for(const [key,id]of [['self_range','selfRange'],['opponent_range','opponentRange']])if(['100','200','all'].includes(sidePreset.get(key)))$(id).value=sidePreset.get(key);
$('deckFilter').onchange=()=>{if($('ranking').value==='carrying')$('ranking').value='carried_overall';page=0;load()};
$('refresh').onclick=load;$('basis').onchange=load;$('partition').onchange=()=>{page=0;render()};$('search').oninput=()=>{page=0;render()};$('minimum').oninput=()=>{page=0;render()};for(const id of ['ranking','minimum','cardPick'])$(id).onchange=()=>{page=0;render()};FilterControls.enhance(['cardPick'],()=>{page=0;render()});load();
</script></body><script src="/statistics/assets/statistics_nav.js"></script></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卡片投入 · 前100观察</title><style>
:root{font:15px "Microsoft YaHei",system-ui,sans-serif;color:#173529;background:#f3f5f0}*{box-sizing:border-box}body{margin:0}header{background:#173f32;color:white;padding:28px max(20px,calc((100vw - 1160px)/2));border-bottom:5px solid #c9e787}header a{color:#d6e5b1}h1{font-size:28px;margin:18px 0 8px}header p{color:#d5e3d6;line-height:1.8}main{max-width:1200px;margin:auto;padding:24px 20px}button,input,select{font:inherit}button{cursor:pointer;background:#275f45;color:white;border:0;padding:11px 18px;border-radius:7px}input,select{padding:10px;border:1px solid #cbd6c9;border-radius:7px;background:white;max-width:100%;color:#234230}label{font-size:13px;color:#647569}label select{display:block;margin-top:6px;width:100%}.search{display:flex;gap:10px;flex-wrap:wrap}.search input{flex:1;min-width:170px}.options{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.options button{background:#e4edda;color:#284e36;text-align:left}.panel{background:white;border:1px solid #dde4da;border-radius:12px;padding:20px;min-width:0;margin-bottom:20px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.note{font-size:13px;line-height:1.8;color:#65776b}.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.chart h2{font-size:18px}.counts{font-size:12px;color:#6e806f;line-height:1.7}.row{display:grid;grid-template-columns:45px 1fr 65px;gap:10px;align-items:center;margin:16px 0;font-size:13px}.track{height:16px;background:#eef3e8;border-radius:4px}.fill{height:100%;background:#7a9d59;border-radius:4px}.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:610px;font-size:14px}th,td{border-bottom:1px solid #e8eee3;padding:12px;text-align:left}th{font-size:12px;color:#6a7f6d}.error{color:#925320}.unknown{color:#8b968d}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #86b273;outline-offset:2px}@media(max-width:760px){.charts{grid-template-columns:1fr}.filters{grid-template-columns:1fr}main{padding:20px 12px}}
</style><style>
.main-nav{display:flex;gap:10px 24px;flex-wrap:wrap;margin-bottom:20px}.main-nav a{font-size:15px;text-decoration:none;padding:8px 0;border-bottom:2px solid transparent}.main-nav a:hover{border-color:currentColor}
</style><link rel="stylesheet" href="/statistics/assets/statistics_nav.css"><link rel="stylesheet" href="/statistics/assets/statistics_theme.css"></head><body><nav class="main-nav" aria-label="主要功能"><a href="/statistics">玩家排名</a><a href="/statistics/card-table">卡片统计</a><a href="/statistics/matrix">系列胜率</a><a href="/statistics/recordings">录像筛选</a></nav><header><h1>一张卡，大家放几张</h1><p>按当前榜单中的玩家统计，每人只取最新有效观测。初始投入只使用同一最新整场中已确认的首局；Side缺失保持未知。</p></header><main>
<section class="panel"><div class="search"><input id="q" type="search" aria-label="卡片名称或卡号" placeholder="输入卡名或卡号" maxlength="80"><button id="find">查找卡片</button></div><div id="options" class="options"></div><div class="filters"><label>构筑选源<select id="basis"><option value="initial">已确认首局的初始构筑</option><option value="observed">最新观测（可能已换边）</option></select></label><label>卡组类型<select id="deck"><option value="">全部类型</option></select></label><label>含系列卡片<select id="series"><option value="">全部系列</option></select></label></div><p id="status" class="note" role="status">选择卡片后查看投入分布。</p></section>
<div id="charts" class="charts"></div><section id="extra" class="panel" hidden></section><section class="panel" id="peoplePanel" hidden><h2>谁在带</h2><p class="note">显示当前筛选下的所有已覆盖玩家，含已知0张；未知不计入比例分母。总投入是每人主卡＋Side合计，额外另列。</p><div class="wrap"><table><thead><tr><th>排名</th><th>玩家</th><th>主卡</th><th>Side</th><th>总投入</th><th>额外</th><th>选源</th></tr></thead><tbody id="people"></tbody></table></div></section><p class="note">同卡名、同效果异画合并计算；原始卡号保留。首局样本不足时不会回退到更旧整场冒充当前，亦不会把换边后构筑当初始构筑。</p></main><script>
const $=id=>document.getElementById(id),el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};let data=null,code=null,cardname='',request=0;
async function api(path){const r=await fetch('/statistics/api/'+path,{cache:'no-store',credentials:'same-origin'});if(!r.ok)throw Error(r.status===403?'访问已到期，请重新从本机入口打开。':await r.text());return r.json()}
function options(id,values,label){const n=$(id),old=n.value;n.replaceChildren(el('option',label));n.firstChild.value='';for(const v of [...new Set(values)].sort()){const o=el('option',v);o.value=v;n.append(o)}n.value=values.includes(old)?old:''}
async function find(){const term=$('q').value.trim();if(!term)return;$('find').disabled=true;$('status').textContent='查找本机卡名库…';try{const result=await api('card-search?q='+encodeURIComponent(term));$('options').replaceChildren();for(const c of result.cards){const b=el('button',c.name+' #'+c.code);b.onclick=()=>{code=c.code;cardname=c.name;load()};$('options').append(b)}$('status').textContent=result.cards.length?'请选择卡片（最多显示20项，可输入完整卡名缩小范围）。':'本机卡名库未找到，请换用卡号或其他名称。'}catch(e){$('status').textContent=e.message}finally{$('find').disabled=false}}
async function load(){if(!code)return;const id=++request;$('status').textContent='读取按人投入分布…';try{const args=new URLSearchParams({code});if($('deck').value)args.set('deck',$('deck').value);if($('series').value)args.set('series',$('series').value);const result=await api('investment?'+args);if(id!==request)return;data=result;render()}catch(e){if(id===request)$('status').textContent=e.message+' 上次结果仅供参考，请重试。'}}
function chart(partition,label){const stats=($('basis').value==='initial'?data.distributions:data.observed_distributions)[partition],box=el('section',undefined,'panel chart');box.append(el('h2',label),el('div',`已知 ${stats.known_players} 人 · 未知 ${stats.unknown_players} 人`,'counts'));if(!stats.known_players)box.append(el('p','暂无完整样本，不作零投入处理。','note'));else for(const bin of stats.bins){const row=el('div',undefined,'row'),track=el('div',undefined,'track'),fill=el('div',undefined,'fill');fill.style.width=bin.percentage+'%';fill.style.background=Number(bin.copies)>=3?'#b08b88':({0:'#c9c4b6',1:'#8fa7b6',2:'#c3ae86'})[Number(bin.copies)]||'#a49ab0';fill.title=bin.copies+'张 · '+bin.players+'人 · '+bin.percentage.toFixed(1)+'%';track.append(fill);row.append(el('span',bin.copies+' 张'),track,el('span',bin.players+'人 / '+bin.percentage.toFixed(1)+'%'));box.append(row)}return box}
function render(){if(!data)return;const initial=$('basis').value==='initial';$('status').textContent=`${cardname} · 异画合并卡号 ${data.card_identity.codes.join(' / ')} · 覆盖 ${data.covered_players}/${data.current_players} 人 · 未采集 ${data.missing_players} 人 · 筛选后 ${data.filtered_players} 人 · 榜单版本 ${data.roster.version}${data.roster.stale?'（已过期，保留上次名单）':''}`;$('charts').replaceChildren(chart('main','主卡投入'),chart('side','Side投入'),chart('total','主卡＋Side总投入'));$('extra').hidden=false;$('extra').replaceChildren(chart('extra','额外投入（独立）'));$('peoplePanel').hidden=false;$('people').replaceChildren();for(const p of data.people){const counts=initial?p.initial_copies:p.copies,tr=el('tr');tr.append(el('td',p.rank),el('td',p.player));for(const key of ['main','side','total','extra'])tr.append(el('td',counts[key]===null?'未知':counts[key]+' 张',counts[key]===null?'unknown':''));tr.append(el('td',initial?(p.initial_source_digest?'已确认同场首局':'首局证据不足'):(p.observation_kind==='post_side'?'换边后':p.observation_kind==='confirmed_first_game'?'已确认首局':'首局状态未知')));$('people').append(tr)}}
$('find').onclick=find;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')find()});$('basis').onchange=render;for(const id of ['deck','series'])$(id).onchange=load;api('roster').then(r=>{options('deck',r.people.filter(p=>p.observed&&p.deck_type).map(p=>p.deck_type),'全部类型');options('series',r.people.flatMap(p=>p.series||[]),'全部系列')}).catch(e=>{$('status').textContent=e.message});
const cardPreset=new URLSearchParams(location.search);if(/^\d+$/.test(cardPreset.get('code')||'')){code=Number(cardPreset.get('code'));if(code>0&&code<=4294967295){$('basis').value=cardPreset.get('basis')==='initial'?'initial':'observed';api('card-search?q='+code).then(r=>{cardname=r.cards[0]?.name||('卡号'+code);$('q').value=cardname;load()}).catch(e=>{$('status').textContent=e.message})}}
</script></body><script src="/statistics/assets/statistics_nav.js"></script></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>卡组命名</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#173529;background:#f3f5f0;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}
header{background:#173f32;color:#fff;padding:30px max(24px,calc((100vw - 1200px)/2));border-bottom:5px solid #c9e787}header small{letter-spacing:.18em;color:#c9e787}h1{font-size:30px;margin:10px 0}header p{color:#d4e2d7;line-height:1.7;max-width:900px;margin:0}
main{max-width:1200px;padding:24px 24px 60px;margin:auto}.main-nav{display:flex;gap:10px 24px;flex-wrap:wrap;margin:18px 0 6px}.main-nav a{font-size:15px;text-decoration:none;padding:8px 0;border-bottom:2px solid transparent}.main-nav a.active{border-color:currentColor;font-weight:600}
.panel{background:#fff;border:1px solid #dde4da;border-radius:12px;padding:20px}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.status{line-height:1.8;color:#52645a;font-size:14px}.status.busy{color:#95551c}.status.busy::before{content:'⏳ '}.filters{display:grid;grid-template-columns:180px minmax(0,1fr) minmax(0,1fr) 180px;gap:12px;margin-bottom:14px}label{font-size:12px;color:#5d7163}input,select{display:block;width:100%;margin-top:7px;padding:10px 9px;border:1px solid #cbd6c9;border-radius:7px;background:#fff;color:#234230}
.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:720px}th{font-size:12px;text-align:left;color:#68796e;background:#f5f7f2}th,td{padding:12px 10px;border-bottom:1px solid #e9eee4}td{font-size:14px;vertical-align:middle}tr.row{cursor:pointer}tr.row:hover{background:#f7faf3}td.rank{font-variant-numeric:tabular-nums;color:#739068;width:52px}.name{font-weight:600;word-break:break-word}.points{font-size:12px;color:#7c897f;margin-top:3px}.deck{display:inline-block;background:#edf3e8;padding:4px 9px;border-radius:6px;font-size:13px;color:#48613e;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}.deck.unknown{background:#fff2df;color:#95551c}.muted{color:#8c968e}.go{border:1px solid #adc0ae;background:#fff;color:#173f32;border-radius:7px;padding:7px 12px;font-size:13px}
dialog{border:1px solid #b5c8b1;border-radius:14px;width:min(860px,95vw);max-height:88vh;padding:0;color:#173529;overflow:hidden}dialog::backdrop{background:#10291db0}.dlghead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px;background:#f5f7f2;border-bottom:1px solid #e3e9dd}.dlghead h2{margin:0;font-size:20px}.dlghead p{margin:6px 0 0;font-size:13px;color:#65776b}.dlgbody{padding:18px 22px 22px;overflow:auto;max-height:calc(88vh - 150px)}#close{border:0;background:#e7efe0;border-radius:8px;padding:8px 12px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.col h3{font-size:14px;margin:0 0 8px;color:#48613e}.cardlist{list-style:none;margin:0;padding:0;font-size:13px;max-height:280px;overflow:auto;border:1px solid #e6ece1;border-radius:8px}.cardlist li{display:flex;justify-content:space-between;gap:8px;padding:6px 9px;border-bottom:1px solid #f0f4ec}.cardlist li:last-child{border:0}.cardlist b{color:#62894d}.note{font-size:12px;color:#7a887c;line-height:1.7}
.form{margin-top:16px;padding:14px;background:#f7faf3;border:1px solid #e3e9dd;border-radius:10px}.form .row{display:flex;gap:10px;align-items:flex-end}.form .row label{flex:1}.form button{border:0;background:#2f6b4f;color:#fff;border-radius:8px;padding:11px 18px;font-size:14px;white-space:nowrap}.form button[disabled]{opacity:.5;cursor:default}#savestatus{margin-top:9px;font-size:13px;color:#48613e;min-height:20px}
@media(max-width:820px){.cards{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.dlgbody{max-height:calc(88vh - 160px)}}
</style><link rel="stylesheet" href="/statistics/assets/statistics_nav.css"><link rel="stylesheet" href="/statistics/assets/statistics_theme.css"></head><body>
<nav class="main-nav" aria-label="主要功能"><a href="/statistics">玩家排名</a><a href="/statistics/cards-report">卡片统计</a><a href="/statistics/cards-extra">额外卡</a><a href="/statistics/matrix">卡组胜率</a><a href="/statistics/recordings">录像筛选</a><a href="/statistics/deck-naming">卡组命名</a></nav>
<header><small>ARENA OBSERVATORY / 本机后台</small><h1>卡组命名</h1><p>按名次列出每位玩家最新一局有效构筑（前100/未识别/前200/全部已采集）；搜索会跨范围查找，榜外已采集玩家也能命名。点一行查看主卡组、额外、Side，然后命名。只改构筑分类，不改对局事实。没有有效对局的玩家会标为"未采集"。</p></header>
<main><section class="panel"><div class="topline"><div id="status" class="status" role="status">正在读取当前名单…</div><button id="reload" class="go">刷新</button></div>
<div class="filters"><label>范围<select id="scope"><option value="100">前100</option><option value="unnamed">未识别（按排名）</option><option value="200">前200（官方单人核验）</option><option value="all">全部已采集</option></select></label><label>查找玩家（跨范围）<input id="search" type="search" placeholder="输入名字，搜索全部已知玩家"></label><label>查找卡组（当前范围）<input id="deckSearch" type="search" list="deck-names" autocomplete="off" placeholder="选择或输入卡组名，如 圣徒"><datalist id="deck-names"></datalist></label><label>只看<select id="only"><option value="all">全部</option><option value="unknown">未识别</option><option value="observed">已采集</option></select></label></div>
<div class="tablewrap"><table><thead><tr><th>排名</th><th>玩家 / 竞技分</th><th>最新卡组</th><th>采集时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" class="note" hidden>没有符合条件的玩家。</p></section></main>
<dialog id="dialog"><div class="dlghead"><div><h2 id="title">—</h2><p id="meta"></p></div><button id="close">关闭</button></div><div class="dlgbody"><div class="cards" id="cards"></div>
<div class="form"><div class="row"><label>卡组名（1—120 字）<input id="deck" maxlength="120" autocomplete="off" placeholder="例如：妖精传姬"></label><button id="save">保存命名</button></div><div id="savestatus" role="status"></div></div>
<p class="note" style="margin-top:12px">保存后写入卡组名字库（按主卡+额外记录）；相同卡组直接沿用，相似卡组按相似度匹配。构筑自身的人工命名优先于相似匹配。</p></div></dialog>
<script>
const $=id=>document.getElementById(id);let rows=[],current=null,busy=false,scope='100',searchTimer=null,lastTotal=0,lastTruncated=false,loadRequest=0;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const time=t=>t?new Date(t*1000).toLocaleString('zh-CN',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
async function api(path,options){const r=await fetch(path,Object.assign({cache:'no-store',credentials:'same-origin'},options||{}));const text=await r.text();if(!r.ok)throw Error(text||('HTTP '+r.status));return text?JSON.parse(text):null}
function render(){const only=$('only').value;const body=$('rows');body.replaceChildren();let shown=0;
 for(const row of rows){if(only==='unknown'&&(!row.observed||row.deck_type))continue;if(only==='observed'&&!row.observed)continue;shown++;
  const tr=el('tr','','row');tr.append(el('td',row.rank==null?'排名暂缺':String(row.rank),'rank'));
  const who=el('td');who.append(el('div',row.player,'name'));who.append(el('div',row.points!=null?row.points.toFixed(1)+' 分':'—','points'));tr.append(who);
  const deck=el('td');deck.append(row.observed?el('span',row.deck_type||'未命名','deck'+(row.deck_type?'':' unknown')):el('span','未采集','deck unknown'));if(row.observed&&row.deck_type&&row.label_source==='same_match_first_game')deck.append(el('small','（继承首局）','muted'));if(row.observed&&row.deck_type&&row.label_source==='manual_similarity')deck.append(el('small','（相似度 '+(row.label_score??'—')+'）','muted'));tr.append(deck);
  tr.append(el('td',time(row.recorded_at),'muted'));
  const action=el('td');const b=el('button','查看并命名','go');b.disabled=!row.observed;if(!row.observed)b.title='还没有有效对局';b.onclick=e=>{e.stopPropagation();openDetail(row)};action.append(b);tr.append(action);
  tr.onclick=()=>{if(row.observed)openDetail(row)};body.append(tr)}
 $('empty').hidden=shown>0;
 const hint=lastTruncated?`（共 ${lastTotal} 人，只显示前 ${rows.length}，请用搜索缩小）`:''; const extra=scope==='200'?' · 前200 只含已核验名次，未核验请看全部或搜索':''; $('status').textContent=`${scope==='search'?'搜索':scope==='100'?'前100':scope==='200'?'前200':scope==='unnamed'?'未识别':'全部已采集'} ${rows.length} 人 · 已采集 ${rows.filter(r=>r.observed).length} · 已识别 ${rows.filter(r=>r.observed&&r.deck_type).length} · 未识别 ${rows.filter(r=>r.observed&&!r.deck_type).length}${hint}${extra}`}
function section(title,items){const col=el('div','col');const total=items.reduce((n,c)=>n+(Number(c.copies)||1),0);col.append(el('h3',`${title}（${total} 张）`));const list=el('ul','cardlist');if(!items.length)list.append(el('li','无记录','muted'));for(const c of items){const li=el('li');li.append(el('span',c.name));li.append(el('b','×'+c.copies));list.append(li)}col.append(list);return col}
async function openDetail(row){current=row;$('title').textContent=`#${row.rank==null?'排名暂缺':row.rank} ${row.player}`;$('meta').textContent='正在读取构筑…';$('cards').replaceChildren();$('deck').value=row.deck_type||'';$('savestatus').textContent='';$('dialog').showModal();
 try{const d=await api('/statistics/api/deck-naming?player='+encodeURIComponent(row.player));current=Object.assign({},row,d);
  $('title').textContent=`#${d.rank==null?'排名暂缺':d.rank} ${d.player}`;$('meta').textContent=`构筑 ${d.build?d.build.slice(0,12):'—'} · 采集 ${d.recorded_text||'—'} · 当前 ${d.deck_type||'未命名'}${d.label_source==='same_match_first_game'?'（继承同场首局）':''}${d.label_source==='manual_similarity'?'（相似度 '+(d.label_score??'—')+'）':''}`;
  const cols=[section('主卡组',d.cards.main||[]),section('额外',d.cards.extra||[])];if((d.cards.side||[]).length)cols.push(section('Side',d.cards.side));const inferred=(d.inferred_side||{}).cards||[];if(inferred.length)cols.push(section((d.inferred_side||{}).fallback?'Side（推测，来自最近可推测对局）':'Side（推测，非直接记录）',inferred));$('cards').replaceChildren(...cols);

  $('deck').value=d.deck_type||''}catch(e){$('meta').textContent='读取失败：'+e.message}}
$('close').onclick=()=>$('dialog').close();
$('save').onclick=async()=>{if(busy||!current||!current.build)return;const deck=$('deck').value.trim();if(!deck){$('savestatus').textContent='卡组名不能为空。';return}
 busy=true;$('save').disabled=true;$('savestatus').textContent='保存中…';
 try{const result=await api('/statistics/api/deck-naming',{method:'POST',headers:{'Content-Type':'application/json','X-Deck-Naming':'1'},body:JSON.stringify({build:current.build,deck:deck,player:current.player})});
  $('savestatus').textContent=`已保存：${result.deck}（修订 ${result.revision}）`;const row=rows.find(r=>r.player===current.player);if(row){row.deck_type=result.deck;row.build=current.build}current.deck_type=result.deck;$('meta').textContent=`构筑 ${current.build.slice(0,12)} · 当前 ${result.deck}`;render()}
 catch(e){$('savestatus').textContent='保存失败：'+e.message}
 finally{busy=false;$('save').disabled=false}};
function fillDeckNames(source){const list=$('deck-names');const known=new Set([...list.options].map(o=>o.value));const names=[...new Set(source.map(r=>r.deck_type).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN'));for(const name of names){if(known.has(name))continue;const option=document.createElement('option');option.value=name;list.append(option)}}
async function load(){const id=++loadRequest;const q=$('search').value.trim(),deck=$('deckSearch').value.trim();const params=new URLSearchParams({scope:$('scope').value});if(q)params.set('q',q);if(deck)params.set('deck',deck);$('status').classList.add('busy');$('status').textContent='筛选中…';try{const data=await api('/statistics/api/deck-naming?'+params.toString());if(id!==loadRequest)return;rows=data.rows;scope=data.scope;lastTotal=data.total||rows.length;lastTruncated=!!data.truncated;fillDeckNames(rows);$('status').classList.remove('busy');render()}catch(e){if(id===loadRequest){$('status').classList.remove('busy');$('status').textContent='读取失败：'+e.message}}}
$('reload').onclick=load;$('scope').onchange=load;$('search').oninput=()=>{$('status').classList.add('busy');$('status').textContent='筛选中…';clearTimeout(searchTimer);searchTimer=setTimeout(load,300)};$('deckSearch').oninput=()=>{$('status').classList.add('busy');$('status').textContent='筛选中…';clearTimeout(searchTimer);searchTimer=setTimeout(load,300)};$('only').onchange=render;load();
</script><script src="/statistics/assets/statistics_nav.js"></script></body></html>

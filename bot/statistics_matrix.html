<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>卡组胜率 · 前100观察</title><style>
:root{font:15px "Microsoft YaHei",system-ui,sans-serif;color:#173529;background:#f3f5f0}*{box-sizing:border-box}body{margin:0}header{background:#173f32;color:white;padding:28px max(20px,calc((100vw - 1160px)/2));border-bottom:5px solid #c9e787}header a{color:#d6e5b1}h1{font-size:28px;margin:18px 0 8px}header p{color:#d5e3d6;line-height:1.8}main{max-width:1200px;margin:auto;padding:24px 20px}button,input,select{font:inherit}button{cursor:pointer;background:#275f45;color:white;border:0;padding:11px 18px;border-radius:7px}input,select{padding:10px;border:1px solid #cbd6c9;border-radius:7px;background:white;max-width:100%;color:#234230}label{font-size:13px;color:#647569}label select{display:block;margin-top:6px;width:100%}.search{display:flex;gap:10px;flex-wrap:wrap}.search input{flex:1;min-width:170px}.options{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.options button{background:#e4edda;color:#284e36;text-align:left}.panel{background:white;border:1px solid #dde4da;border-radius:12px;padding:20px;min-width:0;margin-bottom:20px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.note{font-size:13px;line-height:1.8;color:#65776b}.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.chart h2{font-size:18px}.counts{font-size:12px;color:#6e806f;line-height:1.7}.row{display:grid;grid-template-columns:45px 1fr 65px;gap:10px;align-items:center;margin:16px 0;font-size:13px}.track{height:16px;background:#eef3e8;border-radius:4px}.fill{height:100%;background:#7a9d59;border-radius:4px}.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:610px;font-size:14px}th,td{border-bottom:1px solid #e8eee3;padding:12px;text-align:left}th{font-size:12px;color:#6a7f6d}.error{color:#925320}.unknown{color:#8b968d}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #86b273;outline-offset:2px}@media(max-width:760px){.charts{grid-template-columns:1fr}.filters{grid-template-columns:1fr}main{padding:20px 12px}}

dialog{border:1px solid #b5c8b1;border-radius:14px;padding:24px;width:min(780px,94vw);max-height:88vh;color:#173529}dialog::backdrop{background:#10291db0}.close{float:right;background:#eaf0e2;color:#254e36;padding:7px 12px}.secondary{background:#eaf0e2;color:#254e36;padding:8px 12px;margin:5px}.textbutton{border:0;background:none;color:#32684f;text-decoration:underline;padding:0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:7px}.card{font-size:14px;background:#f4f7f0;padding:9px;border-radius:5px}.download{display:inline-block;background:#275f45;color:white;padding:10px 15px;border-radius:7px;text-decoration:none}.sample-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #e9eee4;padding:11px 0}.metrics-filters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.metrics-filters select{display:block;width:100%;margin-top:7px}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric-value{font-size:30px;color:#28563e;margin:10px 0}.matrix td,.matrix th{text-align:center;min-width:108px}.matrix td:first-child,.matrix th:first-child{position:sticky;left:0;background:#f4f7f0;z-index:1;min-width:140px;text-align:left}.matrix button{display:block;width:100%;padding:6px;background:transparent;color:#234230}.matrix small{display:block;font-size:11px;color:#647466}.pagination{margin:15px 0}.sample-row .note{white-space:nowrap}.empty{padding:25px;color:#7b897d}@media(max-width:760px){.metrics-filters,.metric-grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.sample-row{display:block}}
 .wrap:has(.matrix){max-height:72vh;overflow:auto;position:relative;isolation:isolate}.matrix thead th{position:sticky;top:0;z-index:3;background:#eef3e8;box-shadow:0 2px #ccd6c9}.matrix thead th:first-child{z-index:4} </style><style>
.main-nav{display:flex;gap:10px 24px;flex-wrap:wrap;margin-bottom:20px}.main-nav a{font-size:15px;text-decoration:none;padding:8px 0;border-bottom:2px solid transparent}.main-nav a:hover{border-color:currentColor}
</style><link rel="stylesheet" href="/statistics/assets/statistics_nav.css"><link rel="stylesheet" href="/statistics/assets/statistics_theme.css"><style>@media(max-width:520px){#rows,#columns{height:140px}.metrics-filters{gap:10px}}</style></head><body><nav class="main-nav" aria-label="主要功能"><a href="/statistics">玩家排名</a><a href="/statistics/cards-report">卡片统计</a><a href="/statistics/cards-extra">额外卡</a><a href="/statistics/matrix" aria-current="page">卡组胜率</a><a href="/statistics/recordings">录像筛选</a><a href="/statistics/deck-naming">卡组命名</a></nav><header><h1>谁对谁，赢在什么样本上</h1><p>动态当前榜单玩家视角，默认前200/前200（我方/对手范围可调）；使用当局实际构筑，行对列方向明确，点开每个数字追溯来源。</p></header><main><section class="panel"><div class="search"><button id="refresh">重算矩阵</button></div><div class="metrics-filters"><label>行：我方卡组（可多选，未选为全部）<select id="rows" multiple size="5"></select></label><label>列：对手卡组（可多选，未选为全部）<select id="columns" multiple size="5"></select></label><label>我方范围<select id="selfRange"><option value="100">前100</option><option value="200" selected>前200</option><option value="all">全部</option></select></label><label>对手范围<select id="opponentRange"><option value="100">前100</option><option value="200" selected>前200</option><option value="all">全部</option></select></label><label>实际先后攻<select id="first"><option value="all">总体</option><option value="first">先攻</option><option value="second">后攻</option></select><button id="clear" class="secondary">清空卡组选择</button></label></div><p id="status" class="note" role="status">读取矩阵中…</p></section><section class="panel"><h2>行对列的小局胜率</h2><p class="note">从行玩家视角看列对手，点击有样本的格子，在下方原地展开：我方抽到后胜率较高的卡与该组合录像。内战可贡献双方视角；平局计入已知结果分母，未知胜负不当成负。没有固定前10限制，可自由选择对手列。</p><div class="wrap" tabindex="0" aria-label="可滚动对阵矩阵"><table class="matrix" id="matrix"></table></div><p id="quality" class="note"></p></section><section class="panel" id="cellPanel" hidden><h2 id="cellTitle"></h2><p id="cellMeta" class="note"></p><div style="display:flex;gap:12px;align-items:center;margin:12px 0;flex-wrap:wrap"><label>最低有效样本占比 ≥ <input id="cellThreshold" type="number" min="0" max="100" step="1" value="10" style="width:90px"> %</label><button id="cellReload" class="secondary">重算本格</button></div><h3>我方抽到后胜率较高的卡</h3><div class="wrap"><table id="cellCards"></table></div><p id="cellCardsNote" class="note"></p><h3>该组合对应录像</h3><div class="wrap"><table id="cellRecordings"></table></div><p id="cellRecordingsNote" class="note"></p></section></main><script src="/statistics/assets/statistics_samples.js"></script><script>
const SS=window.StatisticsSamples,$=id=>document.getElementById(id),el=SS.el;let request=0,initialized=false,data=null,current=null,cellRequest=0;
function name(v){return v===null?'卡组未识别':v}function percent(m){return m.percentage===null?'—':m.percentage.toFixed(1)+'%'}
function options(id,values){const n=$(id);for(const v of values){const o=el('option',name(v));o.value=JSON.stringify(v);n.append(o)}}
function cell(c){current=c;$('cellPanel').hidden=false;$('cellTitle').textContent=name(c.row)+' → '+name(c.column);$('cellMeta').textContent='读取本格…';loadCell();$('cellPanel').scrollIntoView({behavior:'smooth',block:'start'})}
function outcomeText(v){return ({win:'胜',loss:'负',draw:'平'})[v]||'未知'}
function firstText(v){return v===1?'先攻':v===0?'后攻':'先后攻未知'}
function renderCell(r){$('cellMeta').textContent=`本次样本：${r.perspectives} 视角／${r.small_games} 唯一小局（已知结果 ${r.denominator}${r.unknown?'，未知 '+r.unknown:''}） · 门槛 ≥ ${r.filters.threshold}% · 方向：我方 ${name(r.row)} → 对手 ${name(r.column)}`;const box=$('cellCards');box.replaceChildren();if(r.cards.length){const head=el('thead'),hr=el('tr');for(const text of ['卡名','卡号','抽到局数','胜/负/平','胜率','样本占比'])hr.append(el('th',text));head.append(hr);box.append(head);const body=el('tbody');for(const card of r.cards){const tr=el('tr');tr.append(el('td',card.name),el('td','#'+card.code),el('td',String(card.n)),el('td',`${card.wins}/${card.losses}/${card.draws}`),el('td',card.rate.toFixed(1)+'%'),el('td',card.sample_percentage.toFixed(1)+'%'));body.append(tr)}box.append(body)}$('cellCardsNote').textContent=(r.notes||[]).join(' ')||'只统计我方主卡的抽到记录；未知结果不计入胜率。';const rec=$('cellRecordings');rec.replaceChildren();if(r.recordings.length){const head=el('thead'),hr=el('tr');for(const text of ['时间','我方','对手','先后攻','结果','录像'])hr.append(el('th',text));head.append(hr);rec.append(head);const body=el('tbody');for(const item of r.recordings){const tr=el('tr'),links=el('td');const dl=el('a','下载');dl.href='/statistics/sample/'+item.digest+'?player='+encodeURIComponent(item.player);const detail=el('a','详情');detail.href='/statistics/build?player='+encodeURIComponent(item.player)+'&digest='+encodeURIComponent(item.digest);links.append(dl,el('span',' · '),detail);tr.append(el('td',SS.time(item.recorded_at)),el('td',item.player),el('td',item.opponent),el('td',firstText(item.first_player)),el('td',outcomeText(item.outcome)),links);body.append(tr)}rec.append(body)}$('cellRecordingsNote').textContent=r.recordings_total?`共 ${r.recordings_total} 个录像（按时间倒序）。`:'本组合没有可用录像。'}
async function loadCell(){if(!current)return;const id=++cellRequest,args=new URLSearchParams({row:JSON.stringify(current.row),column:JSON.stringify(current.column),first:$('first').value,threshold:$('cellThreshold').value.trim()});args.set('self_range',$('selfRange').value);args.set('opponent_range',$('opponentRange').value);try{const r=await SS.api('matrix-cell?'+args);if(id!==cellRequest)return;renderCell(r)}catch(e){if(id!==cellRequest)return;let message=e.message;try{const payload=JSON.parse(message);if(payload.error)message=payload.error}catch(_){} $('cellMeta').textContent=message;$('cellCards').replaceChildren();$('cellRecordings').replaceChildren();$('cellCardsNote').textContent='';$('cellRecordingsNote').textContent=''}}
$('cellThreshold').onchange=loadCell;$('cellReload').onclick=loadCell;$('selfRange').onchange=load;$('opponentRange').onchange=load;
function render(r){data=r;const usage=new Map((r.deck_usage||[]).map(u=>[String(u.deck_type),u.players]));const withUsage=label=>name(label)+(usage.get(String(label))?'（'+usage.get(String(label))+'人）':'');$('matrix').replaceChildren();const head=el('thead'),tr=el('tr');tr.append(el('th','行我方 ↓ / 列对手 →'));for(const c of r.columns)tr.append(el('th',withUsage(c)));head.append(tr);$('matrix').append(head);const body=el('tbody'),index=new Map(r.cells.map(c=>[JSON.stringify([c.row,c.column]),c]));for(const row of r.rows){const tr=el('tr');tr.append(el('td',withUsage(row)));for(const col of r.columns){const td=el('td'),c=index.get(JSON.stringify([row,col]));if(c){const b=el('button',percent(c.metrics));b.append(el('small',`${c.metrics.denominator}已知 / ${c.perspectives}视角`));b.onclick=()=>cell(c);td.append(b);if(c.metrics.percentage!==null)td.style.backgroundColor=`hsl(95 30% ${97-c.metrics.percentage*.2}%)`}else td.textContent='—';tr.append(td)}body.append(tr)}if(!r.cells.length){const tr=el('tr'),td=el('td','暂无符合条件的有效样本。');td.colSpan=Math.max(1,r.columns.length+1);tr.append(td);body.append(tr)}$('matrix').append(body);$('cellPanel').hidden=true;current=null;cellRequest++;$('status').textContent=`${r.perspectives}玩家小局视角／${r.small_games}唯一小局 · 总体胜率${percent(r.total)}（${r.total.numerator}/${r.total.denominator}，未知${r.total.unknown_samples}） · 榜单${r.roster.version}${r.roster.stale?'（已过期）':''} · 统计 ${SS.time(r.generated_at)} · 卡组按当前前100已采集玩家最新有效构筑的使用人数降序（每人一次，人数相同按名称稳定排序）`;const q=r.data_quality;$('quality').textContent=`当前未到期视角 ${q.current_unexpired_views} · 已排除 ${q.excluded_current_views} · 来源缺失 ${q.missing_source_views||0} · 当前榜外 ${q.unexpired_outside_roster_views}。各格、行列和总体均由原始样本计算，不平均百分比。`}
async function load(){const id=++request,args=new URLSearchParams({first:$('first').value});args.set('self_range',$('selfRange').value);args.set('opponent_range',$('opponentRange').value);for(const [field,key]of [['rows','row'],['columns','column']])for(const option of $(field).selectedOptions)args.append(key,option.value);$('status').textContent='读取矩阵中…';try{const r=await SS.api('matrix?'+args);if(id!==request)return;if(!initialized){const values=[...new Set([...r.rows,...r.columns])].sort((a,b)=>(a||'').localeCompare(b||''));options('rows',values);options('columns',values);initialized=true}render(r)}catch(e){if(id===request)$('status').textContent=e.message+(data?' 上次结果已保留，请重试。':'')}}
$('refresh').onclick=load;$('first').onchange=load;$('clear').onclick=()=>{for(const id of ['rows','columns'])for(const o of $(id).options)o.selected=false;load()};load();
</script></body><script src="/statistics/assets/statistics_nav.js"></script></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>卡组复核 · 前100观察</title><style>
:root{font:15px "Microsoft YaHei",system-ui,sans-serif;color:#173529;background:#f3f5f0}*{box-sizing:border-box}body{margin:0}header{background:#173f32;color:white;padding:28px max(20px,calc((100vw - 1160px)/2));border-bottom:5px solid #c9e787}header a{color:#d6e5b1}h1{font-size:28px;margin:18px 0 8px}header p{color:#d5e3d6;line-height:1.8}main{max-width:1200px;margin:auto;padding:24px 20px}button,input,select{font:inherit}button{cursor:pointer;background:#275f45;color:white;border:0;padding:11px 18px;border-radius:7px}input,select{padding:10px;border:1px solid #cbd6c9;border-radius:7px;background:white;max-width:100%;color:#234230}label{font-size:13px;color:#647569}label select{display:block;margin-top:6px;width:100%}.search{display:flex;gap:10px;flex-wrap:wrap}.search input{flex:1;min-width:170px}.options{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.options button{background:#e4edda;color:#284e36;text-align:left}.panel{background:white;border:1px solid #dde4da;border-radius:12px;padding:20px;min-width:0;margin-bottom:20px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.note{font-size:13px;line-height:1.8;color:#65776b}.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.chart h2{font-size:18px}.counts{font-size:12px;color:#6e806f;line-height:1.7}.row{display:grid;grid-template-columns:45px 1fr 65px;gap:10px;align-items:center;margin:16px 0;font-size:13px}.track{height:16px;background:#eef3e8;border-radius:4px}.fill{height:100%;background:#7a9d59;border-radius:4px}.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:610px;font-size:14px}th,td{border-bottom:1px solid #e8eee3;padding:12px;text-align:left}th{font-size:12px;color:#6a7f6d}.error{color:#925320}.unknown{color:#8b968d}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #86b273;outline-offset:2px}@media(max-width:760px){.charts{grid-template-columns:1fr}.filters{grid-template-columns:1fr}main{padding:20px 12px}}
.review-form{display:flex;gap:10px;flex-wrap:wrap}.review-form input{flex:1;min-width:180px}.source-list{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}.textbutton{background:#eaf0e2;color:#2e563b}dialog{border:1px solid #b5c8b1;border-radius:14px;padding:24px;width:min(780px,94vw);max-height:88vh}dialog::backdrop{background:#10291db0}.close{float:right;background:#eaf0e2;color:#284e36}.cards{display:grid;grid-template-columns:1fr 1fr;gap:7px}.card{padding:8px;background:#eff3e9;font-size:14px}.download{display:inline-block;padding:10px;background:#275f45;color:white;margin:8px}.secondary{background:#eaf0e2;color:#28563b;margin:5px}@media(max-width:650px){.cards{grid-template-columns:1fr}}</style><style>
.main-nav{display:flex;gap:10px 24px;flex-wrap:wrap;margin-bottom:20px}.main-nav a{font-size:15px;text-decoration:none;padding:8px 0;border-bottom:2px solid transparent}.main-nav a:hover{border-color:currentColor}
</style><link rel="stylesheet" href="/statistics/assets/statistics_nav.css"><link rel="stylesheet" href="/statistics/assets/statistics_theme.css"><script src="/statistics/assets/statistics_busy.js?v=20261102b"></script></head><body><nav class="main-nav" aria-label="主要功能"><a href="/statistics">玩家排名</a><a href="/statistics/cards-report">卡片统计</a><a href="/statistics/cards-extra">额外卡</a><a href="/statistics/matrix">卡组胜率</a><a href="/statistics/recordings">录像筛选</a><a href="/statistics/deck-naming">卡组命名</a></nav><header><h1>核对实际构筑，再标注类型</h1><p>每人最新有效观测按实际构筑分组。人工标注只作用于这一份构筑及其未到期记录，不把玩家全部历史改名。</p></header><main><section class="panel"><button id="refresh">刷新</button>　<label><input id="all" type="checkbox" style="display:inline;width:auto"> 同时显示已识别构筑，可修正人工类型</label><p id="status" class="note" role="status">读取中…</p><p class="note">请先打开小局来源核对完整卡表。有人同时修改时，旧表单会被拒绝。</p></section><div id="items"></div></main><script src="/statistics/assets/statistics_samples.js"></script><script>
const SS=window.StatisticsSamples,$=id=>document.getElementById(id),el=SS.el;let request=0;
async function load(message=''){const id=++request;$('status').textContent='正在读取待核对构筑…';try{const r=await SS.api('review?all='+($('all').checked?'1':'0'));if(id!==request)return;$('status').textContent=message+`已覆盖 ${r.covered_players} 人，类型未识别 ${r.unknown_players} 人；当前显示 ${r.items.length} 份最新构筑 · 榜单 ${r.roster.version}${r.roster.stale?'（过期名单）':''}`;$('items').replaceChildren();for(const item of r.items){const box=el('section',undefined,'panel');box.append(el('h2',(item.deck_type||'卡组未识别')+' · '+item.people.length+'人 · 最高#'+item.highest_rank));const sources=el('div',undefined,'source-list');for(const person of item.people){const b=el('button',person.player+' · 小局来源','textbutton');b.onclick=()=>SS.show(person,()=>load());sources.append(b)}box.append(sources);const form=el('div',undefined,'review-form'),input=el('input'),save=el('button','保存本构筑人工类型');input.value=item.deck_type||'';input.placeholder='核对卡表后输入卡组类型';input.maxLength=120;input.setAttribute('aria-label','人工卡组类型');form.append(input,save);const feedback=el('p','标注将联动此构筑的未到期统计，不续期。','note');save.onclick=async()=>{if(!input.value.trim()){feedback.textContent='请先输入卡组类型。';return}save.disabled=true;try{const response=await fetch('/statistics/api/classification',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({build:item.build,signature:item.signature,deck_type:input.value.trim()})});if(!response.ok)throw Error(await response.text());const result=await response.json();await load('已保存，联动 '+result.affected_unexpired_views+' 个未到期玩家小局视角。 ')}catch(e){feedback.textContent=e.message;save.disabled=false}};box.append(form,feedback);$('items').append(box)}}catch(e){$('status').textContent=e.message}}
$('refresh').onclick=()=>load();$('all').onchange=()=>load();load();
</script></body><script src="/statistics/assets/statistics_nav.js"></script></html>
